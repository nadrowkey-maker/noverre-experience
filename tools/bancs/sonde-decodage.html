<!doctype html><meta charset="utf-8"><title>sonde</title>
<div id="r">en cours</div>
<script type="module">
const r = document.getElementById('r');
const lignes = [];
try {
  const t0 = performance.now();
  const buf = await (await fetch('/frames/webp-1280/01-facade/0001.webp')).arrayBuffer();
  lignes.push('fetch ok ' + buf.byteLength + ' o en ' + Math.round(performance.now()-t0) + ' ms');
  const bmp = await createImageBitmap(new Blob([buf]));
  lignes.push('createImageBitmap ok ' + bmp.width + 'x' + bmp.height);
  const c = document.createElement('canvas');
  c.width = 8; c.height = 8;
  c.getContext('2d').drawImage(bmp, 0, 0, 8, 8);
  lignes.push('drawImage ok, pixel central ' + [...c.getContext('2d').getImageData(4,4,1,1).data].join(','));
  const gl = document.createElement('canvas').getContext('webgl2');
  lignes.push('webgl2 : ' + (gl ? 'ok' : 'ABSENT'));
  if (gl) lignes.push('EXT_color_buffer_float : ' + (gl.getExtension('EXT_color_buffer_float') ? 'ok' : 'ABSENT'));
  if (gl) lignes.push('renderer : ' + gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL || gl.RENDERER));
} catch (e) { lignes.push('ECHEC : ' + e.message); }
r.textContent = lignes.join(' | ');
</script>
